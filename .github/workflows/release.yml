name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build
        run: |
          go env -w GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          BIN_NAME=yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}
          go build -o $BIN_NAME .
          # Generate SHA256 checksum
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            certutil -hashfile $BIN_NAME SHA256 > $BIN_NAME.sha256
          else
            shasum -a 256 $BIN_NAME > $BIN_NAME.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
          path: |
            yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}
            yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
