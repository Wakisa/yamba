name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          BIN_NAME=yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o $BIN_NAME .
          shasum -a 256 $BIN_NAME > $BIN_NAME.sha256

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinName = "yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}"
          $env:GOOS="${{ matrix.goos }}"
          $env:GOARCH="${{ matrix.goarch }}"
          go build -o $BinName .
          Get-FileHash $BinName -Algorithm SHA256 | Format-List | Out-File "$BinName.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
          path: |
            yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}
            yamba-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}${{ matrix.ext }}.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
